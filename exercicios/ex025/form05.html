<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sx" id="isxmas"> <label for="isxmas">Masculino</label> <br>

            <input type="radio" name="sx" id="isxfem"> <label for="isxfem">Feminino</label>

        </fieldset>
        <fieldset>
            
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="ebas" id="iebas"><label for="iebas">Basquete</label>

            <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut">Futebol</label>

            <input type="checkbox" name="ecorrida" id="iecorrida"><label for="iecorrida">Corrida</label>


        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
